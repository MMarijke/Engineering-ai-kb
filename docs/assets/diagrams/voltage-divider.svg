<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" role="img" aria-labelledby="vd-title vd-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="vd-title">Resistive voltage divider</title>
  <desc id="vd-desc">Input voltage Vin is applied across resistor R1 in series with resistor R2 to ground. The output voltage Vout is taken at the junction between the resistors.</desc>
  <rect width="320" height="250" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <g fill="none" stroke="#24292f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vin lead -->
    <path d="M50 30 H160 V45"/>
    <!-- R1 -->
    <path d="M160 45 V52 L172 58 L148 70 L172 82 L148 94 L160 100 V125"/>
    <!-- R2 -->
    <path d="M160 125 V132 L172 138 L148 150 L172 162 L148 174 L160 180 V205"/>
    <!-- Output tap -->
    <path d="M160 125 H250"/>
    <!-- Ground symbol -->
    <path d="M140 205 H180 M148 212 H172 M156 219 H164"/>
  </g>
  <!-- Terminals and junction -->
  <circle cx="50" cy="30" r="4" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <circle cx="250" cy="125" r="4" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <circle cx="160" cy="125" r="3.5" fill="#24292f"/>
  <!-- Labels -->
  <g fill="#24292f" font-size="14">
    <text x="40" y="35" text-anchor="end">Vin</text>
    <text x="262" y="130">Vout</text>
    <text x="186" y="80">R1</text>
    <text x="186" y="160">R2</text>
  </g>
  <text x="160" y="242" text-anchor="middle" font-size="13" fill="#57606a">Vout = Vin · R2 / (R1 + R2)</text>
</svg>
